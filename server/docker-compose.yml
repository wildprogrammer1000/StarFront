services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localpassword
    volumes:
      - nakama-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakama", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  nakama:
    image: heroiclabs/nakama:3.26.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - |
        /nakama/nakama migrate up --database.address nakama:localpassword@postgres:5432/nakama &&
        exec /nakama/nakama \
          --name starfront-nakama \
          --database.address nakama:localpassword@postgres:5432/nakama \
          --logger.level DEBUG \
          --session.token_expiry_sec 7200 \
          --matchmaker.interval_sec 1 \
          --runtime.path /nakama/data/modules \
          --runtime.js_entrypoint index.js \
          --socket.server_key defaultkey \
          --console.username admin \
          --console.password password
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"

volumes:
  nakama-postgres:
